<form-basic>
  <ng-container moreInfo >
    <ctrl-txt [ctrl]="{ field: 'contact', lbl: 'Contact' }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'email', lbl: 'Email', req:false }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'branch', lbl: 'Branch' }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'address', lbl: 'Address' }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'location', lbl: 'Location', req:false }"></ctrl-txt>
  </ng-container>
</form-basic>
