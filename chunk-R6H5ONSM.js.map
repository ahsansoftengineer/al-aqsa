<mat-card appearance="outlined">
  <mat-card-header style="padding: 5px 0px 0px 10px; margin: -1px;" class="bg-{{data.color}}">
    <div class="dialog-header text-light">
      <div class="dialog-title" style="display: flex; gap: 5px;">
        <mat-icon>{{ data.icon }}</mat-icon>
        <span class="ms-2" >{{ data.title }}</span>
      </div>

      <button mat-icon-button type="button" class="d-flex me-2" (click)="cancel()"  aria-label="Close Dialog">
        <mat-icon class="text-danger">close</mat-icon>
      </button>
    </div>
  </mat-card-header>

  <mat-card-content class="pt-3" style="min-height: 100px; max-height: 80vh;">
    {{ data.message }}
  </mat-card-content>

  <mat-card-actions align="end">
    @if(data.showCancel){
    <button mat-button (click)="cancel()">
      {{ data.cancelText ?? 'Cancel' }}
    </button>
    }

    <button mat-flat-button (click)="confirm()">
      {{ data.confirmText ?? 'OK' }}
    </button>
  </mat-card-actions>
</mat-card>
