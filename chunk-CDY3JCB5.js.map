<form-basic >
  <ng-container moreInfo>
    <ctrl-dd-api
      [ctrl]="{ field: 'examId', lbl: 'Exam' }"
      [req]="{
        srvc: URL_SRVC.Edu,
        cntrl: URL_CONTRL.Edu.Exam
      }">
    </ctrl-dd-api>
    <ctrl-dd-api
      [ctrl]="{ field: 'subjectzId', lbl: 'Subject' }"
      [req]="{
        srvc: URL_SRVC.Edu,
        cntrl: URL_CONTRL.Edu.Subjectz
      }">
    </ctrl-dd-api>
    <ctrl-txt [ctrl]="{ field: 'marksTotal', lbl: 'Total Marks', type: 'number',  }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'marksPassing', lbl: 'Passing Marks', type: 'number' }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'dateExam', lbl: 'Exam Date', type: 'number' }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'timeStart', lbl: 'Start Time', type: 'number' }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'timeEnd', lbl: 'End Time', type: 'number' }"></ctrl-txt>
  </ng-container>
</form-basic>
