<form-basic [isMoreinfo]="true">
  <ng-container moreInfo>
    <ctrl-dd-api
      [ctrl]="{ field: 'userStudentId', lbl: 'Student', req:false }"
      [req]="{
        srvc: URL_SRVC.Userz,
        cntrl: URL_CONTRL.Userz.UserzStudent,
      }">
    </ctrl-dd-api>
    <ctrl-dd-api
      [ctrl]="{ field: 'examSubjectzId', lbl: 'Exam Subject', req:false }"
      [req]="{
        srvc: URL_SRVC.Edu,
        cntrl: URL_CONTRL.Edu.ExamSubjectz,
      }">
    </ctrl-dd-api>
    <ctrl-txt [ctrl]="{ field: 'marksObtain', lbl: 'Obtain Marks', type: 'number' }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'grade', lbl: 'Grade' }"></ctrl-txt>
  </ng-container>
</form-basic>
