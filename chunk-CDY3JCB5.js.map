<form-basic >
  <ng-container moreInfo>
    <ctrl-dd-api
      [ctrl]="{ field: 'examTypeId', lbl: 'Exam Type' }"
      [req]="{
        srvc: URL_SRVC.Edu,
        cntrl: URL_CONTRL.Edu.ExamType
      }">
    </ctrl-dd-api>
    <ctrl-dd-api
      [ctrl]="{ field: 'termId', lbl: 'Terms & Condition', req: false }"
      [req]="{
        srvc: URL_SRVC.Edu,
        cntrl: URL_CONTRL.Edu.Term
      }">
    </ctrl-dd-api>
    <ctrl-txt [ctrl]="{ field: 'marksTotal', lbl: 'Total Marks', type: 'number',  }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'marksPassing', lbl: 'Passing Marks', type: 'number' }"></ctrl-txt>
  </ng-container>
</form-basic>
