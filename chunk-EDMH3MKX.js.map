<div class="row mx-0 px-0 my-2">
  @for (item of (_ss.sideBarMenus || []); track item?.link) {
  <theme-menu-index [item]="item" [isModule]="true">
    <ng-container contentz>
      <mat-card-content class="mt-5">
          @for(it of (item?.submenu ?? []); track it.link){
          <a [routerLink]="[it.link]" (click)="$event.stopPropagation()" class="me-1 mb-1">
              <span style="cursor: pointer;">{{ (it.title || 'No Title') | translate }},</span>
          </a> &nbsp;
          }
        <!-- </mat-chip-set> -->
      </mat-card-content>
    </ng-container>
  </theme-menu-index>
  }
</div>
