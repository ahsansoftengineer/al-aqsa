<tbl-filter-template [filterSystemShow]="true" [filterDefaultShow]="true" [filterAdvanceShow]="true">
  <ng-container filterAdvance>
    <ctrl-opt-radio [ctrl]="{ field: 'gender', lbl: 'Gender', group: _template.lb.filterAdvance }" [listz]="_ss.GENDER"  ></ctrl-opt-radio>
    <ctrl-txt [ctrl]="{ field: 'email', lbl: 'Email',  req:false , group: _template.lb.filterAdvance }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'phone', lbl: 'Phone',  req:false , group: _template.lb.filterAdvance }"></ctrl-txt>
  </ng-container>
</tbl-filter-template>
