<form [formGroup]="_fs._form">
  <div class="row m-0">
    <div class="col-12">
      <h5>Basic Info</h5>
    </div>
    <ctrl-txt [ctrl]="{ field: 'name', lbl: 'Name' }"></ctrl-txt>
    <ctrl-dd-static [ctrl]="{ field: 'status', lbl: 'Status' }" [listz]="{ listStatic: _ss.STATUS }"></ctrl-dd-static>
    @if(_fs._form?.getRawValue()?.updatedAt){
    <ctrl-txt [ctrl]="{ field: 'createdAt', lbl: 'Created At', req: false }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'updatedAt', lbl: 'Updated At', req: false }"></ctrl-txt>
    }

    <ctrl-txt-area [ctrl]="{ field: 'desc', lbl: 'Descritpion', req: false }"></ctrl-txt-area>

    @if(isMoreinfo){
    <div class="col-12">
      <h5>More Info</h5>
    </div>
    <ng-content moreInfo></ng-content>
    }
  </div>
</form>
