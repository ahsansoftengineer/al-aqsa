<div class="w-100 p-2">
  <div class="w-100 d-flex justify-content-end mb-2">
    <button mat-mini-fab color="primary" class="me-2" type="button" (click)="_template.lb.filterShow()">
      <mat-icon class="m-0">filter_alt_off</mat-icon>
    </button>
    <button mat-mini-fab color="primary" class="me-2" type="button" (click)="resetFilters()">
      <mat-icon class="m-0">autorenew</mat-icon>
    </button>
    <button mat-mini-fab color="primary" class="me-2" type="button" (click)="_template.lb.fresh()">
      <mat-icon class="m-0">search</mat-icon>
    </button>
  </div>
  <mat-accordion [multi]="true">
    @if (filterSystemShow) {
    <mat-expansion-panel>
      <mat-expansion-panel-header class="px-3">
        <mat-panel-title>System Filter</mat-panel-title>
        <button mat-icon-button type="button" class="me-3"
          (click)="_template.lb?.filterSystem.reset(); $event.stopPropagation()">
          <mat-icon>restart_alt</mat-icon>
        </button>
      </mat-expansion-panel-header>
      <div>
        <tbl-filter-system></tbl-filter-system>
      </div>
    </mat-expansion-panel>
    }
    @if (filterDefaultShow) {
    <mat-expansion-panel [expanded]="true">
      <mat-expansion-panel-header class="px-3">
        <mat-panel-title>Default Filter</mat-panel-title>

        <button mat-icon-button type="button" class="me-3"
          (click)="_template.lb?.filterDefault.reset(); $event.stopPropagation()">
          <mat-icon>restart_alt</mat-icon>
        </button>
      </mat-expansion-panel-header>
      <div>
        <tbl-filter-default></tbl-filter-default>
      </div>
    </mat-expansion-panel>
    }
    @if (filterAdvanceShow) {
    <mat-expansion-panel>
      <mat-expansion-panel-header class="px-3">
        <mat-panel-title>Advanced Filter</mat-panel-title>

        <button mat-icon-button type="button" class="me-3"
          (click)="_template.lb?.filterAdvance.reset(); $event.stopPropagation()">
          <mat-icon>restart_alt</mat-icon>
        </button>
      </mat-expansion-panel-header>
        <div>
          <ng-content filterAdvance></ng-content>
        </div>
    </mat-expansion-panel>
    }
  </mat-accordion>
</div>
