@if (ctrl?.control) {
<div class="ele-wrap mb-4">
  <label class="d-block ms-3">
    {{ ctrl.lbl | translate }}
    @if (ctrl.req) {
    <span class="text-danger">*</span>
    }
  </label>
  <mat-radio-group [formControl]="ctrl.control" [required]="ctrl.req">
    @for (item of (listz); track item.id) {
    <mat-radio-button [value]="item.id" class="me-3">
      {{ item.name }}
    </mat-radio-button>
    }
  </mat-radio-group>
  @if (ctrl.control?.touched && ctrl.error) {
  <mat-error style="margin-top: -10px; margin-left: 15px;">{{ ctrl.error }}</mat-error>
  } @else if(ctrl.hint){
    <mat-hint>{{ctrl.hint}}</mat-hint>
  }
</div>

}
