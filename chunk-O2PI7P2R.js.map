@if(ctrl?.control){
<mat-form-field appearance="fill" class="col-12 my-1" >
  <mat-label>{{ ctrl.lbl | translate }}</mat-label>
  <mat-select [formControl]="ctrl.control" [required]="ctrl.req">
  @for (item of (listz?.listView | async); track item.id) {
    <mat-option [value]="item.id" [disabled]="ctrl?.control?.value == item.id" (onSelectionChange)="changeEvent(item, $event)">
      {{ item.name }}
    </mat-option>
  }
  </mat-select>
  @if (ctrl.control.touched && ctrl.error) {
    <mat-error>{{ ctrl.error }}</mat-error>
  } @else if(ctrl.hint){
    <mat-hint>{{ctrl.hint}}</mat-hint>
  }
</mat-form-field>
}
