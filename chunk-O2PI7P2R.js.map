@if (ctrl?.control) {
<div class="ele-wrap pt-3 mb-4" (click)="ctrl.control.patchValue(!ctrl.control.value)" style="cursor: pointer;">
  <!-- <label class="d-block ms-3 pt-3">
    {{ ctrl.lbl | translate }}
    @if (ctrl.req) {
    <span class="text-danger">*</span>
    }
  </label> -->
  <mat-checkbox [formControl]="ctrl.control" [disabled]="ctrl.disabled" (click)="$event.stopPropagation()">
    {{ ctrl.lbl | translate }}
    @if (ctrl.req) {
    <span class="text-danger">*</span>
    }
  </mat-checkbox>
  @if (ctrl.control?.touched && ctrl.error) {
  <mat-error style="margin-top: -10px; margin-left: 15px;">{{ ctrl.error }}</mat-error>
  } @else if(ctrl.hint){
    <mat-hint>{{ctrl.hint}}</mat-hint>
  }
</div>

}
