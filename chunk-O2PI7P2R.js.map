@if (ctrl?.control) {
  <mat-form-field appearance="fill" class="col-12 my-1">
    <mat-label>{{ ctrl.lbl | translate }}</mat-label>

    <input
      matInput
      [matDatepicker]="picker"
      [formControl]="ctrl.control"
      [required]="ctrl.req"
      [readonly]="ctrl.readonly"
      (blur)="FuncBlur($event)"
    />

    <mat-datepicker-toggle
      matIconSuffix
      [for]="picker">
    </mat-datepicker-toggle>

    <mat-datepicker #picker [startView]="startView"></mat-datepicker>

  @if (ctrl.control.touched && ctrl.error) {
    <mat-error>{{ ctrl.error }}</mat-error>
  } @else if(ctrl.hint){
    <mat-hint>{{ctrl.hint || 'MM/DD/YYYY'}}</mat-hint>
  }
  </mat-form-field>
}
