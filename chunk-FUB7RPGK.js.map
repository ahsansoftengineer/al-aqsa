@if (_template?.LG) {
<a mat-raised-button color="primary" class="me-2" [routerLink]="link">
  <mat-icon class="me-2">{{ icon }}</mat-icon>
  <span>{{ lbl | translate }}</span>
</a>
} @else {
<a mat-mini-fab color="primary" class="me-2" [routerLink]="link">
  <mat-icon>{{ icon }}</mat-icon>
</a>
}
