@if (_template?.LG) {
<button mat-raised-button type="button" color="primary" class="me-2" (click)="clickz.emit(value)">
  <mat-icon class="me-2">{{ icon }}</mat-icon>
  <span>{{ lbl | translate }}</span>
</button>
}
@else {
<button mat-mini-fab color="primary" class="me-2" type="button" (click)="clickz.emit(value)">
  <mat-icon>{{icon}}</mat-icon>
</button>
}
