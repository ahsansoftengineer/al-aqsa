<mat-card class="dashboard-card p-0 m-1">
  <mat-card-content class="dashboard-card-content p-1">
    <mat-grid-list class="mb-2" cols="12" rowHeight="55px">
      <mat-grid-tile [colspan]="_template.SM || _template.linkPaginate ? 12 : 5" class="flex--start">
        <section>
          @if (_template?.title) {
          <h1 class="m-0 mt-1 fs-5">
            {{ _template?.title | translate }}
          </h1>
          }
          <!-- <p>
            @for (l of (_template?.layer || []); track $index; let i = $index) {
            <a [href]="l">
              {{ i === 0 ? '' : ' / ' }} {{ l }}
            </a>
            }
          </p> -->
        </section>
      </mat-grid-tile>
      @if (_template?.linkAdd && _template?.lb) {
      <mat-grid-tile [colspan]="_template.SM ? 12 : 7" class="flex--end" style="overflow: visible;">
        <btn-link lbl="Add" icon="local_hospital" [link]="_template.linkAdd"></btn-link>
        <btn lbl="Refresh" icon="autorenew" (clickz)="_template.lb.refresh()"></btn>
        <btn lbl="Filter" [icon]="_template?.lb?.filterDefaultShow ? 'filter_alt' : 'filter_alt_off'" (clickz)="_template.lb.filterShow()"></btn>
        <!-- <btn lbl="More" icon="more_vert" [matMenuTriggerFor]="menu"></btn> -->
        <tbl-actions></tbl-actions>

      </mat-grid-tile>
      }
    </mat-grid-list>
    <mat-grid-list cols="1" [rowHeight]="_template?.LG ? '76.5vh' : '72vh'">
      <mat-grid-tile colspan="1">
        <div class="m-1 mx-0" style="width: 100%; height: 100%; overflow-x: auto;">
          <router-outlet></router-outlet>
        </div>
      </mat-grid-tile>
    </mat-grid-list>
    <mat-grid-list cols="1" rowHeight="60px" class="mt-2">
      <mat-grid-tile colspan="1" class="flex--end">
        @if (_template?.linkPaginate) {
        <mat-card-actions align="end">
          @if (_template.tmSubmit) {
          <btn lbl="Reset" icon="cached" (clickz)="_template.tmSubmit.resetForm()"></btn>
          <btn lbl="Save" icon="save" (clickz)="_template.tmSubmit.submit()"></btn>
          <btn-link lbl="Cancel" icon="cancel" [link]="_template?.linkPaginate"></btn-link>
          }
        </mat-card-actions>
        }@else if (_template.linkAdd) {
        <mat-card-actions align="end">
          <tbl-paginator [lb]="_template.lb"></tbl-paginator>
        </mat-card-actions>
        }

      </mat-grid-tile>
    </mat-grid-list>

  </mat-card-content>
</mat-card>
