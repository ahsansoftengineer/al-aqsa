<div class="row mx-1 my-2">
  @for (item of (_ss.activeSideBarParent?.submenu || []); track item?.link) {
  <theme-menu-index [item]="item" [isModule]="false">
    <!-- <ng-container menuz>
      <button mat-icon-button [matMenuTriggerFor]="menu" type="button" (click)="$event.stopPropagation()"
        class="text-danger d-flex align-items-center ms-auto">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu" xPosition="before">
        <a mat-menu-item [routerLink]="[item.link]">
          <mat-icon>list</mat-icon>
          <span>{{ 'List' | translate }}</span>
        </a>

        <a mat-menu-item [routerLink]="[item.link + '-add']">
          <mat-icon>add</mat-icon>
          <span>{{ 'Add' | translate }}</span>
        </a>
      </mat-menu>
    </ng-container> -->
    <ng-container contentz>
      <mat-card-content class="mt-5">
        <p class="text-warning mb-5">
          {{ (item?.desc || 'No description available') | translate }}
        </p>
      </mat-card-content>
    </ng-container>
    <ng-container actionz>
      <mat-card-actions align="end" style="position: absolute; bottom: 5px; right:0px;">
        <a mat-button color="primary" [routerLink]="[item.link]" (click)="$event.stopPropagation()">
          <mat-icon>list</mat-icon>
          {{ 'List' | translate }}
        </a>

        <a mat-button color="primary" [routerLink]="[item.link + '-add']" (click)="$event.stopPropagation()">
          <mat-icon>add</mat-icon>
          {{ 'Add' | translate }}
        </a>
      </mat-card-actions>
    </ng-container>
  </theme-menu-index>
  }
</div>
