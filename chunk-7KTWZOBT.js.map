<mat-card class="example-card" appearance="outlined" style="min-height: 100%; max-width: 100%; cursor: pointer;" [routerLink]="item.link">
  <mat-card-header class="d-flex align-items-center">
    <mat-icon mat-card-avatar class="text-primary m-0 rounded-0 d-flex align-items-center justify-content-center"
      style="width: 40px; height: 40px;">
      {{ item.icon }}
    </mat-icon>
    <mat-card-title class="text-primary px-0 fs-5">
      {{ (item?.title || 'No Title Set') | translate }}
    </mat-card-title>
    <!-- <ng-content menuz></ng-content> -->
  </mat-card-header>
  <div class="menu-card-body text-primary d-flex justify-content-center align-items-center"
    style="height: 100px; font-size: 100px;">
    <a  style="text-decoration: none;">
      {{ item.emoji }}
    </a>
  </div>
  <ng-content contentz></ng-content>
  <ng-content actionz></ng-content>
</mat-card>
