<tbl-filter-template [filterSystemShow]="true" [filterDefaultShow]="true" [filterAdvanceShow]="true">
  <ng-container filterAdvance>
    <div>
      <ctrl-opt-radio [ctrl]="{ field: 'gender', lbl: 'Gender', group: _template.lb.filterAdvance }" [listz]="_ss.GENDER" class="col-12" ></ctrl-opt-radio>
      <ctrl-txt [ctrl]="{ field: 'email', lbl: 'Email',  req:false , group: _template.lb.filterAdvance }" class="col-12"></ctrl-txt>
      <ctrl-txt [ctrl]="{ field: 'phone', lbl: 'Phone',  req:false , group: _template.lb.filterAdvance }" class="col-12"></ctrl-txt>
    </div>
  </ng-container>
</tbl-filter-template>
