<form-basic>
  <ng-container moreInfo>
    <ng-content studentSpecific></ng-content>
    <ctrl-txt [ctrl]="{ field: 'email', lbl: 'Email' }"></ctrl-txt>
    <ctrl-txt [ctrl]="{ field: 'phone', lbl: 'Phone', req: false }"></ctrl-txt>
    <ctrl-date [ctrl]="{ field: 'dob', lbl: 'Date of Birth', req: false }" startView="multi-year"></ctrl-date>
    <ctrl-opt-radio [ctrl]="{ field: 'gender', lbl: 'Gender' }" [listz]="_ss.GENDER"></ctrl-opt-radio>
    <div class="col-12"></div>
    <ctrl-opt-checkbox [ctrl]="{ field: 'isVerifiedEmail', lbl: 'Email Verified', req: false }"></ctrl-opt-checkbox>
    <ctrl-opt-checkbox [ctrl]="{ field: 'isVerifiedPhone', lbl: 'Phone Verified', req: false }"></ctrl-opt-checkbox>
    <ctrl-opt-checkbox [ctrl]="{ field: 'agreeToTermsCondition', lbl: 'Agree Term Condition', req: false }"></ctrl-opt-checkbox>
    <ctrl-opt-checkbox [ctrl]="{ field: 'agreeToPrivacyPolicy', lbl: 'Agree Privacy Policy', req: false }"></ctrl-opt-checkbox>
    <!-- <div class="col-12"></div>
    <ctrl-file-uploader [fileConfig]="fileConfig" [ctrl]="{ field: 'urlImg', lbl: 'Image', req: false }"></ctrl-file-uploader> -->
  </ng-container>
</form-basic>
