<form-userz>
  <ng-container studentSpecific >
    <ctrl-dd-api
      [ctrl]="{ field: 'userzTeacherId', lbl: 'Teacher' }"
      [req]="{
        srvc: URL_SRVC.Userz,
        cntrl: URL_CONTRL.Userz.UserzTeacher,
        body: { pageSize : 30 }
      }">
    </ctrl-dd-api>
    <ctrl-dd-api
      [ctrl]="{ field: 'userzParentId', lbl: 'Parent' }"
      [req]="{
        srvc: URL_SRVC.Userz,
        cntrl: URL_CONTRL.Userz.UserzParent,
      }">
    </ctrl-dd-api>
  </ng-container>
</form-userz>
